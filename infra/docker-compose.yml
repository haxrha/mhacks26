# Optional self-hosted native SpacetimeDB stack. Local CLI setup is verified separately.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      GAME_HOST: ${GAME_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [spacetimedb]
  spacetimedb:
    image: clockworklabs/spacetime:v2.10.2
    restart: unless-stopped
    command: start --listen-addr 0.0.0.0:3000 --data-dir /data --non-interactive
    volumes:
      - stdb_data:/data
    expose: ["3000"]
  publisher:
    build:
      context: ..
      dockerfile: infra/Dockerfile.publisher
    profiles: ["tools"]
    volumes:
      - publisher_identity:/config
    command: ["--root-dir", "/config", "publish", "earthshare-game", "--module-path", "spacetime", "--server", "http://spacetimedb:3000", "--yes=skip-login", "--delete-data=never", "--no-config"]
    depends_on: [spacetimedb]
volumes:
  caddy_data:
  stdb_data:
  publisher_identity:
