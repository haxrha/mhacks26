name: Deploy game server

on:
  push:
    branches: [main]
    paths:
      - "spacetime/**"
      - "apps/orchestrator/**"
      - "infra/**"
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

concurrency: deploy-game-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy.sh on the instance via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.GAME_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["bash /opt/game/infra/aws/deploy.sh"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ vars.GAME_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.GAME_INSTANCE_ID }}" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.GAME_INSTANCE_ID }}" --query Status --output text)
          test "$STATUS" = "Success"
